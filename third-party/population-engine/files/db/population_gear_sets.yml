###########################################################################
# RAGNAROKMAC — 3rd and 4th class sets (companions)
#
# Drafting a companion inherits its profile's gear, and so does a grown
# companion re-gearing at a job change, so every class the Summon tab offers
# needs a set. Two constraints shape what is here:
#
#   - Item ids must be <= 65535. The gear pools are uint16 (population_config
#     resolves a name to its id and narrows it), so the modern 4xxxxx-6xxxxx
#     renewal gear would silently become some other item.
#   - pc_equipitem enforces EquipLevelMin, and a companion advances into its
#     3rd class at base 99 and its 4th at base 200. So third_* sets stay at
#     equip level <= 99 and fourth_* at <= 200, or the first thing a freshly
#     advanced companion does is take its clothes off. A 4th class also only
#     wears items whose Classes allow Fourth, which rules out most of the
#     "3rd-class only" weapons for those sets.
#
# A weapon set never pairs a two-handed weapon pool with a shield: the shield
# is equipped after the weapon and would knock it off.
###########################################################################

  # --- 3rd classes: equip level <= 99, Eden IV armour ----------------------

