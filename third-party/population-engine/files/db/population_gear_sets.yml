###########################################################################
# Population Engine — Shared Gear Sets Database
###########################################################################
#
# Loaded by every population engine database (main, pvp, vendor).
# Job entries reference these GearSets by name via:
#     GearSet: <name>
# so the same equipment pool can be shared across multiple jobs and files
# without duplication.
#
# Contains ONLY GearSetName entries.  Profiles are defined per-source:
#   - Pve profiles  → db/population_engine.yml
#   - PvP profiles  → db/population_pvp.yml
#   - Vendor profile → db/population_vendor_pop.yml
# The arena job pool is auto-derived from the entries in db/population_pvp.yml.
#
###########################################################################

Header:
  Type: POPULATION_ENGINE_DB
  Version: 2

# RenewalOnly (optional): true for a set only 3rd and 4th classes wear. Pre-renewal has no such
# class, and the set's items are renewal-only, so a pre-renewal server passes it over rather
# than log each one as unknown. validate.py checks that no job of the era wears one.
#
# PreRenewal (optional): slot pools, keyed like the set's own, that a pre-renewal server uses
# in place of the set's for each slot listed. Most sets are built from renewal-only items (the
# Paradise/Eden gear), which the pre-renewal item db lacks; without it those slots spawn empty
# there. Renewal ignores the block.

