###########################################################################
# RAGNAROKMAC — 3rd and 4th class companion profiles
#
# Companion-only: nothing in db/population_spawn.yml names these, so they
# never spawn ambiently. They exist because @companion draft (and the
# Summon tab) looks the job up here, and a grown companion re-gears and
# spends its stat and trait points from the profile of the class it has
# just advanced into. Without them a 3rd or 4th class draft is refused
# ("job N has no population profile to inherit"), and a companion that
# grows past transcendent keeps its points unspent and its old gear.
#
#   tier  base lv   job lv  why
#   3rd   99-175    30-60   kPopJobAdvanceTable advances trans -> 3rd at
#                           base 99, so the band starts there; 3rd classes
#                           cap at 200 / job 70 (db/re/job_exp.yml)
#   4th   200-250   1-50    advanced into at base 200; cap 275 / job 60
#
# Stats go to 130 (max_third_parameter / max_fourth_parameter) and traits
# to 110 (max_trait_parameter). A stat a profile declares is also the
# target a growing companion spends its points toward, biggest first, so
# the ranges below are the build, not just a spawn roll. Traits are only
# declared on 4th classes: a profile without them spawns with 0, and only
# a 4th class can spend trait points.
#
# Vehicles (dragon, warg, mado) are set by the engine from the skill tree,
# so these carry no setriding script. Genetic/Biolo get a cart for Cart
# Cannon and Cart Tornado. 3rd-class transcendent ids (4060-4079) are not
# listed: nothing advances into them and the Summon tab cannot draft them.
###########################################################################

  - Profile: companion_third_swordsman    # 3rd  Rune Knight / Royal Guard
    Jobs:
