<!doctype html>
<html>
	<head>
		<meta charset="UTF-8" />
		<title>Ragnarok Offline</title>
		<style>
			html, body { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; background: #060810; }
			#robrowser { height: 100%; width: 100%; }
		</style>
		<script src="./api.js"></script>
	</head>
	<body>
		<div id="robrowser"></div>
		<script>
			// Single-origin setup: the client bundle, the GRF assets and the game
			// socket all come from the RemoteClient-JS unified server on :3338.
			//
			// The server address is read at load time from endpoint.json, which
			// scripts/stack.sh regenerates on every `up`. The guest gets a fresh
			// DHCP lease on each VM boot, so baking the address in would break
			// after a restart.
			function boot(endpoint) {
			var ROConfig = {
				type: ROBrowser.TYPE.FRAME,
				application: ROBrowser.APP.ONLINE,
				target: document.getElementById('robrowser'),
				development: true,
				remoteClient: '/',
				servers: [
					{
						display: 'Ragnarok Offline',
						desc: 'local rAthena',
						address: endpoint.host,
						port: endpoint.login,
						version: 55,
						langtype: 12,
						packetver: 20200401,
						renewal: true,
						worldMapSettings: { episode: 20 },
						packetKeys: false,
						socketProxy: 'ws://127.0.0.1:3338/ws/',
						remoteClient: '/',
						adminList: [2000000]
					}
				],
				loadLua: true,
				skipServerList: true,
				skipIntro: true,
				BGMFileExtension: ['mp3'],
				plugins: {}
			};
			var RO = new ROBrowser(ROConfig);
			RO.start();
			}

			fetch('/endpoint.json')
				.then(function (r) { return r.json(); })
				.then(boot)
				.catch(function () {
					document.body.innerHTML =
						'<p style="color:#e06a6a;font:14px sans-serif;padding:24px">' +
						'Server is not running. Start it from the RagnarokMac launcher.</p>';
				});
		</script>
	</body>
</html>
