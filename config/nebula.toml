# Engine settings for the app's own Nebula instance, copied into NEBULA_HOME
# before the first `nebula up`.
#
# The ports matter: a developer with a standalone Nebula install runs its API on
# 7440, DNS on 42053 and k3s on 6443. The app must not squat on those, or
# whichever came up first wins and the other silently fails to start.
api_port = 7462
dns_port = 42062
k8s_port = 6462

# A ceiling on macOS, where ballooning hands idle RAM back. NOT on Windows or
# Linux: those run the krun backend, whose balloon support is missing and not
# expected, so the guest holds this for as long as it runs. Which is why the app
# overrides this per machine -- a quarter of the host, capped here -- rather than
# giving every machine the same 4 GB. See defaultVmRamMib() in electron/main.js.
#
# This value is the floor the app starts from when it has been told nothing; the
# supervisor passes --ram on every start, from client.json.
max_ram_mib = 4096
cpus = 4
data_disk_gib = 16

dns_zone = "ragnarok.local"

# Published ports bind 127.0.0.1 unless this is on. The supervisor sets it to
# match the app's LAN switch on every start, so the value here is only the
# default a fresh instance begins with — off, because exposing the game servers
# to the network is a decision the player makes, not one an install makes for
# them.
allow_public_publish = false
