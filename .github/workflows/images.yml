name: images

# Builds the two container images the app ships with, and publishes them as a
# rolling release asset on main. Manual runs produce review artifacts only.
#
# These cannot be built in the app workflow. Two reasons, either sufficient:
#
#   * They must match the *guest* architecture, not the runner's. The macOS app
#     runs an arm64 guest; the Linux and Windows apps run x86_64 ones. Building
#     them alongside the app would produce arm64 images for a macOS runner and
#     x86_64 for the others by luck rather than by intent, and would produce
#     nothing at all on Windows, which has no Linux docker daemon.
#   * `docker save` needs a real docker daemon. nebula-slim stores layers
#     unpacked and rejects the command outright, so this is one of the few
#     things the slim engine cannot do.
#
# So they are built here, on native Linux runners with real Docker, and the app
# build downloads them.
#
# Output, attached to the rolling `images` prerelease:
#   images-arm64.tar.gz   ragnarokmac/rathena + ragnarokmac/mariadb, docker save
#   images-x64.tar.gz     the same, for x86_64 guests
#   rathena-sql.tar.gz    main.sql + logs.sql, extracted from the image
#
# The schema is in here rather than in the repo because it belongs to the
# rAthena build: `bootstrap.sh` extracts it from the image it just built, and
# MariaDB imports it on first boot. A schema that drifted from the server
# binary would fail at runtime, on someone else's machine, as a query error.

on:
  push:
    branches: [main]
    paths:
      - 'containers/**'
      - '.github/workflows/images.yml'
      - 'tests/integration/mariadb-secrets.py'
      # The packet versions are build args for the rAthena image, so a change
      # to the list has to rebuild.
      - 'config/PACKETVERS'
      - 'scripts/packetvers.sh'
      # What goes *into* the server. The population engine's sources, patches
      # and spawn tables are compiled and copied into the image, and the script
      # that applies them decides how -- so a change to either changes the
      # image. Without these, three commits' worth of server changes sat
      # unbuilt behind a workflow watching only the Dockerfile.
      - 'third-party/**'
      - 'scripts/apply-server-mods.sh'
      - 'scripts/apply-crash-trace.py'
      # The rAthena commit itself. Our fixes to rAthena are commits on the
      # fork that this pins, so moving the pin changes the server as surely as
      # editing a patch used to.
      - 'config/VENDOR_PINS'
  workflow_dispatch:
    inputs:
      diagnostics:
        description: Build development-only ASan/UBSan images instead of release images
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  diagnostics:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.diagnostics }}
    uses: ./.github/workflows/diagnostics.yml
  # One source of truth for the packet versions: config/PACKETVERS, whose
  # first line is also the image tag precache.sh looks for at runtime. A
  # second copy here would drift and the app would silently pull nothing.
  versions:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.diagnostics }}
    runs-on: ubuntu-latest
    outputs:
      default: ${{ steps.read.outputs.default }}
      all: ${{ steps.read.outputs.all }}
      matrix: ${{ steps.read.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        run: |
          set -e
          echo "default=$(scripts/packetvers.sh default)" >> "$GITHUB_OUTPUT"
          echo "all=$(scripts/packetvers.sh all | paste -sd' ' -)" >> "$GITHUB_OUTPUT"
          echo "matrix=[$(scripts/packetvers.sh all | sed 's/.*/"&"/' | paste -sd, -)]" >> "$GITHUB_OUTPUT"
          echo "packet versions: $(scripts/packetvers.sh all | paste -sd' ' -)"

  # Every packet version is two full rAthena builds (renewal and pre-renewal),
  # and a runner's cores are already saturated by one -- so the versions go to
  # separate runners rather than separate stages on one. Each job runs the
  # Dockerfile's own `build` stage for its one version and exports what it
  # made; the `build` job below assembles them into the image.
  compile:
    needs: versions
    strategy:
      fail-fast: true
      matrix:
        # Native runners. Emulated cross-builds of rAthena take the better
        # part of an hour and have their own failure modes; both arches have
        # a real runner, so neither is worth it.
        platform:
          - { runner: ubuntu-24.04, arch: x64 }
          - { runner: ubuntu-24.04-arm, arch: arm64 }
        packetver: ${{ fromJSON(needs.versions.outputs.matrix) }}
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - uses: actions/checkout@v4

      # rAthena's source is the build context, so our Dockerfile is copied into
      # the checkout — the same thing bootstrap.sh does locally.
      - name: Compile rAthena for ${{ matrix.packetver }}
        run: |
          set -e
          ./scripts/vendor-fetch.sh rathena /tmp/rathena
          ./scripts/apply-server-mods.sh /tmp/rathena
          cp containers/rathena/Dockerfile /tmp/rathena/Dockerfile.ragnarokmac
          args=(-f /tmp/rathena/Dockerfile.ragnarokmac
            --build-arg "DEFAULT_PACKETVER=${{ needs.versions.outputs.default }}"
            --build-arg "PACKETVERS=${{ matrix.packetver }}")
          docker build "${args[@]}" --target compiled --output type=local,dest=out/compiled /tmp/rathena
          # Same build, cached: only the export differs.
          docker build "${args[@]}" --target debug-symbols --output type=local,dest=out/symbols /tmp/rathena
          ls -l out/compiled/bin

      # Tarred, because upload-artifact drops the executable bit.
      - name: Package
        run: tar czf "compiled-${{ matrix.platform.arch }}-${{ matrix.packetver }}.tar.gz" -C out .

      - uses: actions/upload-artifact@v4
        with:
          name: compiled-${{ matrix.platform.arch }}-${{ matrix.packetver }}
          path: compiled-${{ matrix.platform.arch }}-${{ matrix.packetver }}.tar.gz
          retention-days: 1
          if-no-files-found: error

  build:
    needs: [versions, compile]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      PACKETVER: ${{ needs.versions.outputs.default }}
      PACKETVERS: ${{ needs.versions.outputs.all }}
    steps:
      - uses: actions/checkout@v4

      - name: Build the database image
        run: docker build -t ragnarokmac/mariadb:11.4 containers/mariadb

      - name: Validate database secret bootstrap against the image
        run: python3 tests/integration/mariadb-secrets.py

      - uses: actions/download-artifact@v4
        with:
          pattern: compiled-${{ matrix.arch }}-*
          path: compiled

      # Every version's binaries into one directory, which the Dockerfile's
      # final stage takes in place of compiling them (BINARIES=prebuilt). The
      # shared conf/, db/ and npc/ are identical in every artifact. The final
      # stage refuses to build if any version's binaries are missing.
      - name: Assemble rAthena
        run: |
          set -e
          mkdir -p prebuilt symbols empty
          for ver in $PACKETVERS; do
            mkdir -p "unpacked/$ver"
            tar xzf "compiled/compiled-${{ matrix.arch }}-$ver/compiled-${{ matrix.arch }}-$ver.tar.gz" -C "unpacked/$ver"
            cp -a "unpacked/$ver/compiled/." prebuilt/
            cp -a "unpacked/$ver/symbols/." symbols/
          done
          ls -l prebuilt/bin
          docker build -f containers/rathena/Dockerfile \
            --build-arg BINARIES=prebuilt --build-context prebuilt=prebuilt \
            --build-arg "DEFAULT_PACKETVER=$PACKETVER" --build-arg "PACKETVERS=$PACKETVERS" \
            -t "ragnarokmac/rathena:$PACKETVER" empty

      - name: Export matching native debug symbols
        run: |
          set -e
          mkdir -p native-symbols
          cp -a symbols/. native-symbols/
          printf '%s\n' '${{ github.sha }}' > native-symbols/app-source.txt
          docker image inspect "ragnarokmac/rathena:$PACKETVER" --format '{{.Id}}' > native-symbols/image-id.txt
          tar czf "rathena-symbols-${{ matrix.arch }}-${{ github.sha }}.tar.gz" -C native-symbols .
          sha256sum "rathena-symbols-${{ matrix.arch }}-${{ github.sha }}.tar.gz" > "rathena-symbols-${{ matrix.arch }}-${{ github.sha }}.sha256"

      - name: Save the bundle
        run: |
          set -e
          docker save "ragnarokmac/rathena:$PACKETVER" ragnarokmac/mariadb:11.4 \
            | gzip -9 > "images-${{ matrix.arch }}.tar.gz"
          # The same assertion precache.sh makes: confirm this is a docker-save
          # archive before publishing it, rather than discovering at load time
          # on a user's machine that it is not.
          gunzip -c "images-${{ matrix.arch }}.tar.gz" | tar t 2>/dev/null \
            | grep -q "manifest.json\|index.json" \
            || { echo "not a docker-save archive" >&2; exit 1; }
          ls -lh "images-${{ matrix.arch }}.tar.gz"

      # Architecture-independent, so one job publishes it and the other does
      # not — two jobs uploading the same asset name race each other.
      - name: Extract the database schema
        if: matrix.arch == 'x64'
        run: |
          set -e
          mkdir -p sql
          cid=$(docker create "ragnarokmac/rathena:$PACKETVER" true)
          docker cp "$cid:/rathena/sql-files/main.sql" sql/01-main.sql
          docker cp "$cid:/rathena/sql-files/logs.sql" sql/02-logs.sql
          docker rm "$cid" >/dev/null
          tar czf rathena-sql.tar.gz -C sql .
          ls -lh rathena-sql.tar.gz

      - name: Upload reviewable image artifacts
        uses: actions/upload-artifact@v4
        with:
          name: container-images-${{ matrix.arch }}
          path: |
            images-${{ matrix.arch }}.tar.gz
            rathena-sql.tar.gz
            rathena-symbols-${{ matrix.arch }}-${{ github.sha }}.tar.gz
            rathena-symbols-${{ matrix.arch }}-${{ github.sha }}.sha256
          retention-days: 30
          if-no-files-found: error

      # A rolling tag, not a version. These track the Dockerfiles, which change
      # on their own schedule, and the app build fetches them by this tag
      # explicitly — so cutting an app release never has to carry a fresh copy
      # of two container images with it. Marked prerelease so it does not
      # present itself as a version of the app on the releases page.
      - name: Publish
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: images
          name: Container images
          prerelease: true
          body: |
            Container images for the app payload, rebuilt when the Dockerfiles
            change. Not a release of Ragnarok Offline — consumed by the `build`
            workflow.
          files: |
            images-${{ matrix.arch }}.tar.gz
            rathena-sql.tar.gz
            rathena-symbols-${{ matrix.arch }}-${{ github.sha }}.tar.gz
            rathena-symbols-${{ matrix.arch }}-${{ github.sha }}.sha256
