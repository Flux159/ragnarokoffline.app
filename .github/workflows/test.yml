name: Test
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  server-language:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # Upstream, without our fixes: each diagnostic must still find its bug
      # there. When one stops finding it, upstream has fixed it, and our commit
      # on the fork's `ragnarokoffline` branch can be dropped at the next merge.
      - run: bash scripts/vendor-fetch.sh rathena-upstream vendor/rathena-upstream
      - run: python3 tests/diagnostics/verify-language.py vendor/rathena-upstream --expect-fault
      - run: python3 tests/diagnostics/verify-base-sp.py vendor/rathena-upstream --expect-fault
      - run: python3 tests/diagnostics/verify-skill-level.py vendor/rathena-upstream --expect-fault
      - run: python3 tests/diagnostics/verify-weapon-bounds.py vendor/rathena-upstream --expect-fault
      # Our fork, which carries the fixes, before and after our own additions.
      - run: bash scripts/vendor-fetch.sh rathena vendor/rathena
      - run: python3 tests/diagnostics/verify-language.py vendor/rathena
      - run: python3 tests/diagnostics/verify-base-sp.py vendor/rathena
      - run: python3 tests/diagnostics/verify-skill-level.py vendor/rathena
      - run: python3 tests/diagnostics/verify-weapon-bounds.py vendor/rathena
      - run: bash scripts/apply-server-mods.sh vendor/rathena
      - run: bash scripts/apply-server-mods.sh vendor/rathena
      - run: python3 tests/diagnostics/verify-language.py vendor/rathena
      - run: python3 tests/diagnostics/verify-base-sp.py vendor/rathena
      - run: python3 tests/diagnostics/verify-skill-level.py vendor/rathena
      - run: python3 tests/diagnostics/verify-weapon-bounds.py vendor/rathena
      # The population tables: a job claimed by two profiles silently empties
      # one of them, and the server says nothing. Gear is checked against the
      # renewal item database.
      - run: python3 third-party/population-engine/validate.py vendor/rathena
      - run: python3 tests/diagnostics/verify-shell-returns.py
      # vendor/rathena is now the pin with the server mods applied, the tree the
      # navigation-server-npcs, -monsters and -warps indexes describe (each
      # one's test matches the name). The test skips without such a
      # checkout; here it must not, or a pin bump would leave the index stale
      # unnoticed. scripts/navigation-index.sh regenerates it.
      - uses: dtolnay/rust-toolchain@stable
      - name: The navigation indexes describe the pinned server
        env:
          REQUIRE_PINNED_RATHENA: "1"
        run: cargo test --locked --quiet --manifest-path stack/Cargo.toml the_shipped_index_matches_the_pinned_server
  client-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bash scripts/vendor-fetch.sh roBrowserLegacy vendor/roBrowserLegacy
      - name: Apply the patch set twice to the release pin
        run: |
          bash scripts/patch-client.sh
          git -C vendor/roBrowserLegacy diff --binary > /tmp/client-first.patch
          bash scripts/patch-client.sh
          git -C vendor/roBrowserLegacy diff --binary > /tmp/client-second.patch
          cmp /tmp/client-first.patch /tmp/client-second.patch
      - run: npm ci --prefix vendor/roBrowserLegacy
      - run: npm --prefix vendor/roBrowserLegacy run build -- --O --T --H
      - run: node --test tests/client-extensions.test.cjs
      # A mod cannot be merged without its digests matching its files, or the
      # app refuses the download and nobody can tell which half is wrong.
      - name: The mod index matches the mod folders
        run: python3 scripts/mod-index.py --check
  supervisor-and-lifecycle:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: stack
      - run: cargo test --locked --manifest-path stack/Cargo.toml
      - run: cargo build --locked --manifest-path stack/Cargo.toml
      - run: node --check electron/main.js
      - name: Check Windows acceptance script syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'scripts/test-windows-install.ps1'), [ref]$null, [ref]$parseErrors) | Out-Null
          if ($parseErrors) { throw ($parseErrors | Out-String) }
      - name: Build the pinned Rust dependency
        timeout-minutes: 12
        shell: bash
        run: bash scripts/build-remoteclient.sh
      - name: Build the pinned container client and verify private stdin capability
        shell: bash
        run: bash scripts/build-docker-slim.sh
      # tests/navigation-names.test.cjs runs the client's navigation merge in
      # a real Lua; it skips without one, so one runner must have it.
      - name: Install Lua for the navigation merge test
        if: runner.os == 'Linux'
        run: sudo apt-get install -y -qq lua5.1 || (sudo apt-get update -qq && sudo apt-get install -y -qq lua5.1)
      - name: Test lifecycle and the real process protocol
        timeout-minutes: 5
        shell: bash
        env:
          REQUIRE_LUA: ${{ runner.os == 'Linux' && '1' || '' }}
        run: |
          binary_path="$(node -p 'require("node:path").resolve("bin/robrowser-remoteclient" + (process.platform === "win32" ? ".exe" : ""))')"
          stack_path="$(node -p 'require("node:path").resolve("stack/target/debug/ragnarok-stack" + (process.platform === "win32" ? ".exe" : ""))')"
          REMOTECLIENT_BIN="$binary_path" STACK_BIN="$stack_path" node --test --test-timeout=45000 --test-reporter=spec tests/*.test.cjs
