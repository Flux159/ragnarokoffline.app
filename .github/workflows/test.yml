name: Test
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  supervisor-and-lifecycle:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: stack
      - run: cargo test --locked --manifest-path stack/Cargo.toml
      - run: node --check electron/main.js
      - name: Build the pinned Rust dependency and test the real process protocol
        shell: bash
        run: |
          bash scripts/build-remoteclient.sh
          bin="$PWD/bin/robrowser-remoteclient"
          if [ "$RUNNER_OS" = Windows ]; then bin="$bin.exe"; fi
          REMOTECLIENT_BIN="$bin" node --test tests/*.test.cjs
