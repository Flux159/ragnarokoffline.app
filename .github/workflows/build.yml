name: build

# Builds Ragnarok Offline for macOS, Linux and Windows.
#
# The shape of this file is dictated by one fact: the app is mostly *other
# people's software*, and the pieces come from three different places with three
# different build requirements.
#
#   payload/vendor  roBrowserLegacy + ROenglishRE — public, built here with npm
#   payload/dist    rAthena + MariaDB images — needs a real Docker daemon, and
#                   must match the *guest* architecture, not the runner's, so
#                   images.yml builds them on native Linux runners
#   payload/bin     ragnarok-stack (built here from stack/), plus nebula,
#                   nebulad, docker-slim, robrowser-remoteclient —
#   payload/lib     private repos, built there and consumed here. Three
#   payload/guest   separate release assets: the embed kit (nebula, nebulad,
#                   guest images, and on Linux/Windows libkrun), the slim host
#                   CLIs (docker-slim), and the asset server binary.
#
# So this does not try to build everything from source. It assembles a payload
# from released artifacts and builds the app around it. The alternative — having
# CI clone and build nebula and the asset server — makes every app build depend
# on two other toolchains and turns a five-minute job into a forty-minute one.
#
# Required secrets:
#   DEPS_TOKEN            PAT with read access to the private dependency repos
#   APPLE_CERT_P12_BASE64 Developer ID Application cert, base64 of a .p12
#   APPLE_CERT_PASSWORD   .p12 export password
#   APPLE_API_KEY_P8      App Store Connect key, raw .p8 contents (notarisation)
#   APPLE_API_KEY_ID      key id                                  (notarisation)
#   APPLE_API_ISSUER_ID   issuer uuid                             (notarisation)
# or, instead of those three:
#   APPLE_ID              Apple ID used for notarisation
#   APPLE_APP_SPECIFIC_PASSWORD   from appleid.apple.com
#   APPLE_TEAM_ID         10-character team id
#
# The Apple secret names deliberately match nebula's, which already has them
# set for the same Developer ID — same names, same semantics, so a value that
# works there works here without being reshaped.
#
# Notarisation is skipped when the Apple secrets are absent, so the workflow is
# useful before they are set up.

# Tags and manual runs only. A full build is three platforms, an npm client
# build and a signed, notarised DMG — minutes of runner time and an Apple
# notarisation round-trip. That is release work, not per-commit work.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Pinned, not "whatever is latest".
#
# An unpinned fetch takes the newest release, which is only correct if every
# release has its kits attached by the time anything asks. nebula tags first
# and its three kit workflows attach afterwards, so there is a window -- minutes
# to hours -- where the newest release has no kits at all and every app build
# fails on a fetch that has nothing to do with the app. It also means the engine
# inside a shipped build was whatever happened to be current that afternoon,
# which is not a property a release should have.
#
# Bump deliberately, once the kits for the new version exist.
env:
  NEBULA_VERSION: v0.2.0

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # The client is public and platform-independent, so it is built once and
  # shared. It is also the slowest npm step, and rebuilding it per-platform
  # would triple that for an identical result.
  # ---------------------------------------------------------------------------
  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 24, not 22, and only in this job. roBrowserLegacy ships no lockfile,
      # so `npm install` re-resolves its whole tree from the registry on every
      # run -- and npm 10, which is what Node 22 bundles, crashes resolving the
      # tree it now gets:
      #
      #     npm error Cannot read properties of null (reading 'edgesOut')
      #
      # Nothing changed on our side or theirs: v1.0.4 built from this same
      # unpinned clone and their last package.json edit was weeks earlier. A
      # dependency published upstream in between, and npm 10 cannot handle the
      # result. npm 11 (Node 24) installs and builds it fine.
      #
      # The app job stays on 22 deliberately: it installs from our own
      # committed package-lock.json, so it is not exposed to this.
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Fetch roBrowserLegacy and ROenglishRE
        run: |
          mkdir -p vendor
          git clone --depth 1 https://github.com/MrAntares/roBrowserLegacy.git vendor/roBrowserLegacy
          git clone --depth 1 https://github.com/llchrisll/ROenglishRE.git vendor/ROenglishRE

      - name: Apply our patches
        run: scripts/patch-client.sh

      - name: Build the client
        working-directory: vendor/roBrowserLegacy
        run: |
          npm install --no-audit --no-fund
          npm run build:all

      # build:all emits seven ~12 MB bundles and the game loads one. package.sh
      # prunes too, but pruning here keeps the artifact small enough to be worth
      # caching between jobs.
      - name: Prune the viewer bundles
        working-directory: vendor/roBrowserLegacy/dist/Web
        run: rm -f GrfViewer.js MapViewer.js ModelViewer.js StrViewer.js EffectViewer.js GrannyModelViewer.js

      - uses: actions/upload-artifact@v4
        with:
          name: client
          path: |
            vendor/roBrowserLegacy/dist/Web
            vendor/ROenglishRE/Translation/Renewal
          retention-days: 1

  # ---------------------------------------------------------------------------
  # One app per platform. Only macOS signs, because it is the only one with a
  # certificate today — not because the others are less real.
  # ---------------------------------------------------------------------------
  app:
    needs: client
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: mac
            arch: arm64
            triple: aarch64-apple-darwin
            clis: macos-aarch64
          # nebula-slim is validated on Linux and Windows, so these are real
          # targets rather than packaging exercises. Each pulls the embed kit
          # built for its own host triple.
          - os: ubuntu-latest
            platform: linux
            arch: x64
            triple: x64-unknown-linux
            clis: linux-x86_64
          - os: windows-latest
            platform: win
            arch: x64
            triple: x64-pc-windows
            clis: windows-x86_64
    runs-on: ${{ matrix.os }}
    # The `secrets` context is not available in a step's `if:` — only in `env:`
    # and `with:`. So the presence of each credential is resolved once here, at
    # job level, where secrets *are* readable, and the steps below condition on
    # the resulting booleans instead. Job-level env is in scope for a step's
    # `if:`; a step's own `env:` is not (GitHub evaluates the condition first).
    env:
      # Every part of a credential, not just its first part. A .p12 with no
      # password fails `security import` outright rather than skipping, which
      # would take the whole release down over a missing secret; notarisation
      # needs all three App Store Connect values or none.
      HAS_CERT: ${{ secrets.APPLE_CERT_P12_BASE64 != '' && secrets.APPLE_CERT_PASSWORD != '' }}
      HAS_NOTARY_KEY: ${{ secrets.APPLE_API_KEY_P8 != '' && secrets.APPLE_API_KEY_ID != '' && secrets.APPLE_API_ISSUER_ID != '' }}
      # The other way to notarise. An App Store Connect key is the better shape
      # -- it does not expire with the Apple ID -- but its issuer uuid exists
      # only in App Store Connect and cannot be recovered from a machine that
      # has been notarising for months. An Apple ID with an app-specific
      # password needs nothing that is not already on the developer's Mac.
      HAS_NOTARY_APPLEID: ${{ secrets.APPLE_ID != '' && secrets.APPLE_APP_SPECIFIC_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The one thing this workflow compiles. stack/ is a small dependency-free
      # crate, so a cached build is under a minute; it is built per-platform
      # here rather than fetched, because unlike nebula and the asset server it
      # is our own code in this repo.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: stack

      - uses: actions/download-artifact@v4
        with:
          name: client
          path: vendor

      # The private half. These are built in their own repos and published as
      # release assets; consuming them here keeps this workflow independent of
      # two Rust toolchains and a kernel build.
      - name: Fetch engine and asset server
        env:
          GH_TOKEN: ${{ secrets.DEPS_TOKEN }}
        run: |
          set -e
          if [ -z "$GH_TOKEN" ]; then
            echo "DEPS_TOKEN is not set — cannot fetch the engine or asset server." >&2
            echo "See the header of this file for what it needs access to." >&2
            exit 1
          fi
          mkdir -p /tmp/kit /tmp/clis

          # nebula publishes one embed kit per host triple. Its contents are not
          # identical across platforms — macOS carries the slim CLIs and no
          # lib/, Linux and Windows carry lib/ and no CLIs — so this only
          # unpacks it. package.sh knows what to take out of it.
          gh release download "$NEBULA_VERSION" --repo Flux159/nebula \
             --pattern 'nebula-slim-embed-${{ matrix.triple }}.tar.gz' --dir /tmp
          tar xzf /tmp/nebula-slim-embed-${{ matrix.triple }}.tar.gz -C /tmp/kit

          # docker-slim ships separately, as one of the three slim host CLIs.
          # The Linux and Windows embed kits do not include it, and the app
          # cannot talk to the engine without it.
          if [ ! -e /tmp/kit/bin/docker-slim ] && [ ! -e /tmp/kit/bin/docker-slim.exe ]; then
            gh release download "$NEBULA_VERSION" --repo Flux159/nebula \
               --pattern 'nebula-slim-clis-*-${{ matrix.clis }}.tar.gz' --dir /tmp/clis
            tar xzf /tmp/clis/*.tar.gz -C /tmp/clis --strip-components=1
            echo "DOCKER_SLIM_BIN=$(ls /tmp/clis/docker-slim*)" >> "$GITHUB_ENV"
          fi

          # Pinned to this platform's binary. A `robrowser-remoteclient-*` glob
          # matches all three and copies whichever the shell lists last.
          bin=robrowser-remoteclient-${{ matrix.triple }}
          [ "${{ matrix.platform }}" = "win" ] && bin="$bin.exe"
          gh release download --repo Flux159/roBrowserLegacy-RemoteClient-Rust \
             --pattern "$bin" --dir /tmp
          chmod +x "/tmp/$bin" || true
          echo "NEBULA_EMBED_KIT=/tmp/kit" >> "$GITHUB_ENV"
          echo "REMOTECLIENT_BIN=/tmp/$bin" >> "$GITHUB_ENV"
        shell: bash

      # Built by images.yml on native Linux runners and fetched by its rolling
      # tag rather than as "the latest release" — the latest release of this
      # repo is an app version, which carries no images.
      # github.token, not DEPS_TOKEN: these assets are in this repo, and the
      # run's own token has a per-run quota of its own. DEPS_TOKEN is a personal
      # access token whose 5,000/hr is shared with every other thing that account
      # does — including a person running `gh` at a terminal — so borrowing it
      # for a download it is not needed for makes the build fail for reasons
      # that have nothing to do with the build. It did exactly that on v0.1.0.
      - name: Fetch server images and schema
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          gh release download images --repo ${{ github.repository }} \
             --pattern "images-${{ matrix.arch }}.tar.gz" --dir /tmp || {
            echo "No server images for ${{ matrix.arch }}." >&2
            echo "Run the images workflow, which publishes them to the 'images' tag." >&2
            exit 1
          }
          # Where package.sh looks for it. If this file is absent the script
          # falls back to building the images with precache.sh, which needs a
          # real docker client the runner does not have -- so staging it
          # afterwards is too late.
          mkdir -p dist
          mv /tmp/images-${{ matrix.arch }}.tar.gz dist/images.tar.gz
          # The rAthena schema, extracted from the image it belongs to. package.sh
          # takes it from .ragnarokmac/sql, which locally is written by bootstrap
          # and here comes down with the images it was extracted from.
          mkdir -p .ragnarokmac/sql
          gh release download images --repo ${{ github.repository }} \
             --pattern 'rathena-sql.tar.gz' --dir /tmp
          tar xzf /tmp/rathena-sql.tar.gz -C .ragnarokmac/sql
          ls .ragnarokmac/sql
        shell: bash

      - name: Assemble the payload
        run: scripts/package.sh
        shell: bash

      - name: Report the signing configuration
        if: matrix.platform == 'mac'
        run: |
          echo "code signing: ${{ env.HAS_CERT }}"
          echo "notarisation (api key): ${{ env.HAS_NOTARY_KEY }}"
          echo "notarisation (apple id): ${{ env.HAS_NOTARY_APPLEID }}"
          [ "${{ env.HAS_CERT }}" = "true" ] || \
            echo "::warning::Building an unsigned macOS app — APPLE_CERT_P12_BASE64 and APPLE_CERT_PASSWORD must both be set to sign."
          if [ "${{ env.HAS_NOTARY_KEY }}" = "true" ]; then
            echo "notarising with an App Store Connect API key"
          elif [ "${{ env.HAS_NOTARY_APPLEID }}" = "true" ]; then
            echo "notarising with an Apple ID and app-specific password"
          else
            echo "::warning::Skipping notarisation — set either APPLE_API_KEY_P8 + APPLE_API_KEY_ID + APPLE_API_ISSUER_ID, or APPLE_ID + APPLE_APP_SPECIFIC_PASSWORD + APPLE_TEAM_ID."
          fi

      - name: Import signing certificate
        if: matrix.platform == 'mac' && env.HAS_CERT == 'true'
        env:
          CERT: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          echo "$CERT" | base64 --decode > /tmp/cert.p12
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import /tmp/cert.p12 -k build.keychain -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ci build.keychain
          rm -f /tmp/cert.p12

      # electron-builder wants APPLE_API_KEY to be a *path* to the .p8, not its
      # contents, so the secret has to land on disk before the build.
      - name: Stage the notarisation key
        if: matrix.platform == 'mac' && env.HAS_NOTARY_KEY == 'true'
        env:
          KEY: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          mkdir -p ~/private_keys
          # Written verbatim, not base64-decoded: the secret holds the .p8's
          # contents, which is how nebula stores the same key.
          printf '%s' "$KEY" > ~/private_keys/AuthKey.p8
          echo "APPLE_API_KEY=$HOME/private_keys/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Build
        env:
          # electron-builder notarises when all three are present and skips
          # otherwise, which is what makes this workflow usable before the Apple
          # credentials exist. APPLE_API_KEY comes from the step above via
          # GITHUB_ENV when it ran.
          APPLE_API_KEY_ID: ${{ env.HAS_NOTARY_KEY == 'true' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ env.HAS_NOTARY_KEY == 'true' && secrets.APPLE_API_ISSUER_ID || '' }}
          # Only when the key path is not configured, so the two never both
          # apply and leave it ambiguous which one notarised the build.
          APPLE_ID: ${{ env.HAS_NOTARY_KEY != 'true' && env.HAS_NOTARY_APPLEID == 'true' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ env.HAS_NOTARY_KEY != 'true' && env.HAS_NOTARY_APPLEID == 'true' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ env.HAS_NOTARY_KEY != 'true' && env.HAS_NOTARY_APPLEID == 'true' && secrets.APPLE_TEAM_ID || '' }}
          # Auto-discovery hunts the keychain for an identity and fails the
          # build when there is none, so it follows the certificate rather than
          # the platform.
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ matrix.platform == 'mac' && env.HAS_CERT == 'true' }}
        run: |
          npm install --no-audit --no-fund
          npx electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish never
        shell: bash

      # The check that matters: the shell scripts inside the bundle must be the
      # ones in this commit. The payload is copied at build time, so a stale
      # assembly step ships silently — it did twice, locally, before this
      # existed.
      - name: Verify the bundle matches the source
        if: matrix.platform == 'mac'
        run: |
          APP="dist/electron/mac-arm64/Ragnarok Offline.app"
          # Against the hash sidecar, not the binary: signing rewrites the
          # Mach-O, so the shipped binary never matches the build output byte
          # for byte. The sidecar is a text file, is not signed, and still
          # catches the failure this guards -- a stale payload in the bundle.
          built=$(shasum -a 256 stack/target/release/ragnarok-stack | awk '{print $1}')
          # macOS-only step, so shasum is safe here; package.sh needs the
          # portable version because it also runs on Windows.
          shipped=$(cat "$APP/Contents/Resources/payload/bin/ragnarok-stack.sha256")
          [ "$built" = "$shipped" ] \
            || { echo "ragnarok-stack in the bundle is not from this build" >&2; exit 1; }
          # The check that 0.2.0 needed and did not have: mount the .dmg,
          # copy the app out, and verify the signature there.
          #
          # The image is HFS+ and a destination like /Applications is APFS,
          # and they normalise non-ASCII filenames differently. A bundle
          # carrying one can verify perfectly inside the image and be refused
          # as "damaged" the moment it is dragged out -- which is exactly what
          # shipped, past a check that only ever looked inside.
          DMG=$(ls dist/electron/*.dmg | head -1)
          MP=$(mktemp -d); OUT=$(mktemp -d)
          hdiutil attach "$DMG" -nobrowse -readonly -mountpoint "$MP" >/dev/null
          cp -R "$MP/Ragnarok Offline.app" "$OUT/"
          hdiutil detach "$MP" >/dev/null
          codesign --verify --strict "$OUT/Ragnarok Offline.app" \
            || { echo "the app is not validly signed after being copied out of the dmg" >&2; exit 1; }
          rm -rf "$OUT" "$MP"

          # And prove the shipped one actually runs after signing.
          #
          # Captured, not piped: an unknown verb prints usage and exits 2 by
          # design, and this shell runs with pipefail -- so `binary | grep`
          # reports the binary's exit code even when grep matched, and the
          # check failed on a binary that was working perfectly.
          out=$("$APP/Contents/Resources/payload/bin/ragnarok-stack" bogus 2>&1 || true)
          case "$out" in
            *usage*) ;;
            *) echo "the bundled ragnarok-stack did not print usage: $out" >&2; exit 1 ;;
          esac
          # No scripts/ check: the payload deliberately carries none. Everything
          # the app runs is the supervisor binary, verified above.
          codesign --verify --strict "$APP" || echo "unsigned (no certificate configured)"
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: ragnarok-offline-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/electron/*.dmg
            dist/electron/*.AppImage
            dist/electron/*.exe
          if-no-files-found: warn

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: app
    runs-on: ubuntu-latest
    steps:
      # Only the app artifacts. Without a pattern this downloads every artifact
      # in the run, which includes `client` -- the built roBrowser tree, some
      # thousands of small files. Attaching those as release assets trips
      # GitHub's secondary rate limit and fails the release.
      - uses: actions/download-artifact@v4
        with:
          pattern: ragnarok-offline-*
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          # Installers only, named explicitly rather than by a recursive glob,
          # so a new artifact in the run cannot silently become a release asset.
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.AppImage
            artifacts/**/*.exe
          generate_release_notes: true
