[package]
name = "ragnarokmac"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
license = "GPL-3.0-or-later"
description = "Ragnarok Online, offline, in a single macOS app"

[lib]
name = "ragnarokmac_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
signal-hook = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
