<!doctype html>
<html>
<head>
<meta charset="UTF-8" />
<title>Ragnarok Offline</title>
<link rel="stylesheet" href="theme.css" />
<style>
  html, body { height: 100%; overflow: hidden; }
  .boot {
    height: 100%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 18px;
    background: radial-gradient(ellipse at 50% 35%, var(--panel) 0%, var(--bg) 70%);
  }
  .mark {
    width: 46px; height: 46px; border-radius: 50%;
    border: 3px solid var(--accent-dim); border-top-color: var(--accent);
    animation: spin .85s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .title {
    font-size: 15px; letter-spacing: 3px; text-transform: uppercase;
    color: var(--accent-hi);
  }
  .status { color: var(--dim); font-size: 12px; min-height: 18px; }
  .fail { color: var(--bad); max-width: 460px; text-align: center; line-height: 1.7; }
  button {
    background: var(--accent); color: #0d0f15; border: 0; border-radius: 6px;
    padding: 8px 18px; font-weight: 600; font-size: 13px; cursor: pointer;
  }
  button:hover { background: var(--accent-hi); }
</style>
</head>
<body>
  <div class="boot">
    <div class="mark" id="mark"></div>
    <div class="title">Ragnarok Offline</div>
    <div class="status" id="status">Starting the server…</div>
    <div class="fail" id="fail" hidden></div>
    <button id="retry" hidden>Retry</button>
    <button id="repair" class="ghost" hidden>Repair…</button>
  </div>
<script>
const { invoke } = window.__TAURI__.core;

const status = document.getElementById('status');
// Remembered so a failure can name the step it died on, which is the one thing
// worth knowing when someone reports "it just hung".
let lastPhase = 'Starting the server…';
const fail = document.getElementById('fail');
const retry = document.getElementById('retry');
const repair = document.getElementById('repair');
const mark = document.getElementById('mark');

// The stack takes ~30s from cold: MariaDB has to come up healthy before the
// three rAthena servers will connect to each other.
const DEADLINE_MS = 180000;

// Asked through Rust rather than fetch(): this page is served from
// tauri://localhost, a secure origin, so a plain-http request from here is
// blocked as mixed content and fails silently forever.
const ready = () => invoke('assets_ready');

async function boot() {
  fail.hidden = true; retry.hidden = true; repair.hidden = true; mark.hidden = false;

  // No client configured yet: hand off to the setup window and stop here.
  if (!(await invoke('client_ready'))) {
    status.textContent = 'Waiting for your client…';
    await invoke('open_setup');
    return;
  }

  const started = Date.now();

  // start_stack is one blocking call that can run for minutes on a first
  // launch, so the phase has to be polled *alongside* it rather than after —
  // otherwise the window shows one unchanging line for the whole wait and a
  // hang looks exactly like slow progress.
  let ticking = true;
  const show = async () => {
    while (ticking) {
      const p = await invoke('stack_phase').catch(() => '');
      if (p && p !== 'Ready') lastPhase = p;
      const secs = Math.round((Date.now() - started) / 1000);
      status.textContent = `${lastPhase} ${secs}s`;
      await new Promise(r => setTimeout(r, 1000));
    }
  };
  show();

  try {
    await invoke('start_stack');
  } catch (e) {
    ticking = false;
    return giveUp(String(e));
  }
  // Deadline runs from when the stack finished starting, not from boot(). On a
  // first launch stack.sh itself can take several minutes — installing guest
  // images, loading 58 MB of container images, initialising the database — and
  // timing that against the readiness budget would fail a run that was working
  // fine. `started` stays as it is purely for the elapsed display.
  const readyFrom = Date.now();
  while (Date.now() - readyFrom < DEADLINE_MS) {
    if (await ready()) {
      ticking = false;
      status.textContent = 'Loading the client…';
      await invoke('launch_game');
      return;
    }
    await new Promise(r => setTimeout(r, 1500));
  }
  ticking = false;
  giveUp(`Stalled at: ${lastPhase}\nThe server did not come up in time.`);
}

function giveUp(message) {
  mark.hidden = true;
  status.textContent = '';
  fail.textContent = message;
  fail.style.whiteSpace = 'pre-line';
  fail.hidden = false;
  retry.hidden = false;
  repair.hidden = false;
}

retry.onclick = boot;

// Restarting the engine is the one recovery that works when the daemon itself
// is stuck, and it is the only one available to someone with no terminal.
repair.onclick = async () => {
  repair.disabled = true;
  fail.textContent = 'Repairing…';
  try {
    await invoke('stack_repair');
    repair.disabled = false;
    boot();
  } catch (e) {
    repair.disabled = false;
    giveUp(String(e));
  }
};
boot();
</script>
</body>
</html>
