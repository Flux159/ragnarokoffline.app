<!doctype html>
<html>
<head>
<meta charset="UTF-8" />
<title>Ragnarok Offline</title>
<link rel="stylesheet" href="theme.css" />
<style>
  html, body { height: 100%; overflow: hidden; }
  .boot {
    height: 100%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 18px;
    background: radial-gradient(ellipse at 50% 35%, var(--panel) 0%, var(--bg) 70%);
  }
  .mark {
    width: 46px; height: 46px; border-radius: 50%;
    border: 3px solid var(--accent-dim); border-top-color: var(--accent);
    animation: spin .85s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .title {
    font-size: 15px; letter-spacing: 3px; text-transform: uppercase;
    color: var(--accent-hi);
  }
  .status { color: var(--dim); font-size: 12px; min-height: 18px; }
  .fail { color: var(--bad); max-width: 460px; text-align: center; line-height: 1.7; }
  button {
    background: var(--accent); color: #0d0f15; border: 0; border-radius: 6px;
    padding: 8px 18px; font-weight: 600; font-size: 13px; cursor: pointer;
  }
  button:hover { background: var(--accent-hi); }
</style>
</head>
<body>
  <div class="boot">
    <div class="mark" id="mark"></div>
    <div class="title">Ragnarok Offline</div>
    <div class="status" id="status">Starting the server…</div>
    <div class="fail" id="fail" hidden></div>
    <button id="retry" hidden>Retry</button>
  </div>
<script>
const { invoke } = window.__TAURI__.core;

const status = document.getElementById('status');
const fail = document.getElementById('fail');
const retry = document.getElementById('retry');
const mark = document.getElementById('mark');

// The stack takes ~30s from cold: MariaDB has to come up healthy before the
// three rAthena servers will connect to each other.
const DEADLINE_MS = 180000;

// Asked through Rust rather than fetch(): this page is served from
// tauri://localhost, a secure origin, so a plain-http request from here is
// blocked as mixed content and fails silently forever.
const ready = () => invoke('assets_ready');

async function boot() {
  fail.hidden = true; retry.hidden = true; mark.hidden = false;

  // No client configured yet: hand off to the setup window and stop here.
  if (!(await invoke('client_ready'))) {
    status.textContent = 'Waiting for your client…';
    await invoke('open_setup');
    return;
  }

  status.textContent = 'Starting the server…';
  try {
    await invoke('start_stack');
  } catch (e) {
    return giveUp(String(e));
  }
  const started = Date.now();
  while (Date.now() - started < DEADLINE_MS) {
    if (await ready()) {
      status.textContent = 'Loading the client…';
      await invoke('launch_game');
      return;
    }
    const secs = Math.round((Date.now() - started) / 1000);
    status.textContent = `Starting the server… ${secs}s`;
    await new Promise(r => setTimeout(r, 1500));
  }
  giveUp('The server did not come up in time. Open Settings (⌘,) to see what is running.');
}

function giveUp(message) {
  mark.hidden = true;
  status.textContent = '';
  fail.textContent = message;
  fail.hidden = false;
  retry.hidden = false;
}

retry.onclick = boot;
boot();
</script>
</body>
</html>
